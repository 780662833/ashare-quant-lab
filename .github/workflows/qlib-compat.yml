name: qlib-real-api-compat

on:
  pull_request:
    paths:
      - "src/ashare_quant/research/qlib_*.py"
      - "tests/integration/**"
      - "tests/test_research_qlib_dataset.py"
      - ".github/workflows/qlib-compat.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/ashare_quant/research/qlib_*.py"
      - "tests/integration/**"
      - "tests/test_research_qlib_dataset.py"
      - ".github/workflows/qlib-compat.yml"
      - "pyproject.toml"

jobs:
  qlib-real-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project base and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install real Qlib and LightGBM compatibility targets
        run: python -m pip install "pandas>=2.2,<3" "pyqlib==0.9.7" "lightgbm>=4.5,<5"
      - name: Report real research stack versions
        run: |
          python -c "import sys, pandas, qlib, lightgbm; print('Python:', sys.version); print('Qlib:', getattr(qlib, '__version__', 'version attribute unavailable')); print('Pandas:', pandas.__version__); print('LightGBM:', lightgbm.__version__)"
      - name: Run real Qlib API smoke test (synthetic data; no model fit)
        run: python -m pytest -q tests/integration/test_qlib_real_api_smoke.py
